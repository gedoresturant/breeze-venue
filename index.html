-- نفّذ هذا السكريبت في Supabase SQL Editor

-- 1) Enable UUID
create extension if not exists "pgcrypto";

-- 2) Plans
create table if not exists breeze_plans (
  id uuid primary key default gen_random_uuid(),
  name text not null,
  price numeric not null,
  duration_days int not null,
  features jsonb default '[]'::jsonb,
  color text default '#0EA5E9',
  is_active boolean default true,
  created_at timestamptz default now()
);

-- 3) Members
create table if not exists breeze_members (
  id uuid primary key default gen_random_uuid(),
  username text unique not null,
  password text not null,
  full_name text not null,
  phone text,
  plan_id uuid references breeze_plans(id) on delete set null,
  expiry_date date,
  status text default 'active' check (status in ('active','expired','suspended')),
  face_descriptor jsonb,
  created_at timestamptz default now()
);

-- 4) News
create table if not exists breeze_news (
  id uuid primary key default gen_random_uuid(),
  title text not null,
  content text not null,
  created_at timestamptz default now()
);

-- 5) Entries Log
create table if not exists breeze_entries (
  id uuid primary key default gen_random_uuid(),
  member_id uuid references breeze_members(id) on delete cascade,
  entry_type text default 'face' check (entry_type in ('face','qr','manual')),
  verified_by text,
  created_at timestamptz default now()
);

-- 6) System Users (admin / security)
create table if not exists users (
  id uuid primary key default gen_random_uuid(),
  username text unique not null,
  password text not null,
  role text not null check (role in ('admin','security')),
  full_name text,
  created_at timestamptz default now()
);

-- 7) Disable RLS for simplicity (GitHub Pages demo)
alter table breeze_plans disable row level security;
alter table breeze_members disable row level security;
alter table breeze_news disable row level security;
alter table breeze_entries disable row level security;
alter table users disable row level security;

-- OR if you want RLS enabled with open policies:
